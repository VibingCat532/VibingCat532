<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="316" viewBox="0 0 1000 316" role="img" aria-label="Engineering standards"><title>Engineering standards</title><style>.m{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace}.s{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}</style><defs><linearGradient id="ta" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="170" y2="0"><stop offset="0" stop-color="#8BE6E6"/><stop offset="1" stop-color="#8BE6E6" stop-opacity="0"/></linearGradient></defs><g transform="translate(0 0)"><rect x=".5" y=".5" width="321" height="149" rx="14" fill="#0B0E12" stroke="#1a212c"/><path d="M20 .75H170" stroke="url(#ta)" stroke-width="1.5"/><rect x="20" y="20" width="38" height="38" rx="10" fill="#0c1418" stroke="#173238"/><g transform="translate(27 27)" fill="none" stroke="#8BE6E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2.5L4.5 13.5H11l-1 8 8.5-11H12z"/></g><text class="m" x="302" y="38" font-size="11" fill="#5b6673" text-anchor="end">01</text><text class="m" x="20" y="88" font-size="13.5" fill="#E6EDF3" font-weight="700">RESMON BUDGET</text><text class="s" x="20" y="113" font-size="13" fill="#a3b0bc">Idle target 0.00–0.01 ms. No Wait(0)</text><text class="s" x="20" y="133" font-size="13" fill="#a3b0bc">loops unless something is on screen.</text></g><g transform="translate(339 0)"><rect x=".5" y=".5" width="321" height="149" rx="14" fill="#0B0E12" stroke="#1a212c"/><path d="M20 .75H170" stroke="url(#ta)" stroke-width="1.5"/><rect x="20" y="20" width="38" height="38" rx="10" fill="#0c1418" stroke="#173238"/><g transform="translate(27 27)" fill="none" stroke="#8BE6E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 7.9-7.5 9.5-4.3-1.6-7.5-4.9-7.5-9.5V6z"/><path d="M8.8 12l2.2 2.2 4.2-4.4"/></g><text class="m" x="302" y="38" font-size="11" fill="#5b6673" text-anchor="end">02</text><text class="m" x="20" y="88" font-size="13.5" fill="#E6EDF3" font-weight="700">SERVER IS THE SOURCE OF TRUTH</text><text class="s" x="20" y="113" font-size="13" fill="#a3b0bc">Job, item, distance and rate limits</text><text class="s" x="20" y="133" font-size="13" fill="#a3b0bc">are re-checked server-side. Always.</text></g><g transform="translate(678 0)"><rect x=".5" y=".5" width="321" height="149" rx="14" fill="#0B0E12" stroke="#1a212c"/><path d="M20 .75H170" stroke="url(#ta)" stroke-width="1.5"/><rect x="20" y="20" width="38" height="38" rx="10" fill="#0c1418" stroke="#173238"/><g transform="translate(27 27)" fill="none" stroke="#8BE6E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5.2 9.2A2 2 0 0 0 6.5 21h11a2 2 0 0 0 1.7-2.8L14 9V3"/><path d="M7.4 15h9.2"/></g><text class="m" x="302" y="38" font-size="11" fill="#5b6673" text-anchor="end">03</text><text class="m" x="20" y="88" font-size="13.5" fill="#E6EDF3" font-weight="700">TESTED BEFORE IT SHIPS</text><text class="s" x="20" y="113" font-size="13" fill="#a3b0bc">Lua specs with mocked natives —</text><text class="s" x="20" y="133" font-size="13" fill="#a3b0bc">62 scenarios in hs-evidence alone.</text></g><g transform="translate(0 166)"><rect x=".5" y=".5" width="321" height="149" rx="14" fill="#0B0E12" stroke="#1a212c"/><path d="M20 .75H170" stroke="url(#ta)" stroke-width="1.5"/><rect x="20" y="20" width="38" height="38" rx="10" fill="#0c1418" stroke="#173238"/><g transform="translate(27 27)" fill="none" stroke="#8BE6E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/></g><text class="m" x="302" y="38" font-size="11" fill="#5b6673" text-anchor="end">04</text><text class="m" x="20" y="88" font-size="13.5" fill="#E6EDF3" font-weight="700">MIGRATIONS, NOT GUESSWORK</text><text class="s" x="20" y="113" font-size="13" fill="#a3b0bc">Versioned SQL, real indexes, caches</text><text class="s" x="20" y="133" font-size="13" fill="#a3b0bc">instead of a query on every tick.</text></g><g transform="translate(339 166)"><rect x=".5" y=".5" width="321" height="149" rx="14" fill="#0B0E12" stroke="#1a212c"/><path d="M20 .75H170" stroke="url(#ta)" stroke-width="1.5"/><rect x="20" y="20" width="38" height="38" rx="10" fill="#0c1418" stroke="#173238"/><g transform="translate(27 27)" fill="none" stroke="#8BE6E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></g><text class="m" x="302" y="38" font-size="11" fill="#5b6673" text-anchor="end">05</text><text class="m" x="20" y="88" font-size="13.5" fill="#E6EDF3" font-weight="700">NUI THAT FEELS NATIVE</text><text class="s" x="20" y="113" font-size="13" fill="#a3b0bc">React / Svelte + Tailwind, shipped</text><text class="s" x="20" y="133" font-size="13" fill="#a3b0bc">prebuilt — no Node on the FXServer.</text></g><g transform="translate(678 166)"><rect x=".5" y=".5" width="321" height="149" rx="14" fill="#0B0E12" stroke="#1a212c"/><path d="M20 .75H170" stroke="url(#ta)" stroke-width="1.5"/><rect x="20" y="20" width="38" height="38" rx="10" fill="#0c1418" stroke="#173238"/><g transform="translate(27 27)" fill="none" stroke="#8BE6E6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8l8 4.5v9.4l-8 4.5-8-4.5V7.3z"/><path d="M4 7.3l8 4.5 8-4.5M12 11.8v9.4"/></g><text class="m" x="302" y="38" font-size="11" fill="#5b6673" text-anchor="end">06</text><text class="m" x="20" y="88" font-size="13.5" fill="#E6EDF3" font-weight="700">DROP-IN RELEASES</text><text class="s" x="20" y="113" font-size="13" fill="#a3b0bc">Clear config, install notes and a</text><text class="s" x="20" y="133" font-size="13" fill="#a3b0bc">changelog with every single update.</text></g></svg>
