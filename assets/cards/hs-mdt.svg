">CORE</text><text class="s" x="24" y="102" font-size="13.5" fill="#a3b0bc">The tablet every officer lives in: people and vehicle</text><text class="s" x="24" y="122" font-size="13.5" fill="#a3b0bc">records, charges, citations, BOLOs, live dispatch,</text><text class="s" x="24" y="142" font-size="13.5" fill="#a3b0bc">units, duty time, licenses and a full audit log.</text><rect x="25" y="164.5" width="6" height="6" transform="rotate(45 28 167.5)" fill="#8BE6E6"/><text class="m" x="40" y="172" font-size="11" fill="#8BE6E6">14 SQL tables · 7 migrations · 25 server modules</text><rect x="24.0" y="188" width="34.9" height="20" rx="6" fill="#10161c" stroke="#1f2833"/><text class="m" x="41.45" y="201.78" font-size="10.5" fill="#b4c0cb" text-anchor="middle" textLength="18.9" lengthAdjust="spacing">Lua</text><rect x="64.9" y="188" width="47.5" height="20" rx="6" fill="#10161c" stroke="#1f2833"/><text class="m" x="88.65" y="201.78" font-size="10.5" fill="#b4c0cb" text-anchor="middle" textLength="31.5" lengthAdjust="spacing">React</text><rect x="118.4" y="188" width="79.0" height="20" rx="6" fill="#10161c" stroke="#1f2833"/><text class="m" x="157.9" y="201.78" font-size="10.5" fill="#b4c0cb" text-anchor="middle" textLength="63.0" lengthAdjust="spacing">TypeScript</text><rect x="203.4" y="188" width="66.4" height="20" rx="6" fill="#10161c" stroke="#1f2833"/><text class="m" x="236.6" y="201.78" font-size="10.5" fill="#b4c0cb" text-anchor="middle" textLength="50.4" lengthAdjust="spacing">Tailwind</text><rect x="275.8" y="188" width="60.1" height="20" rx="6" fill="#10161c" stroke="#1f2833"/><text class="m" x="305.85" y="201.78" font-size="10.5" fill="#b4c0cb" text-anchor="middle" textLength="44.1" lengthAdjust="spacing">Zustand</text><rect x="341.9" y="188" width="60.1" height="20" rx="6" fill="#10161c" stroke="#1f2833"/><text class="m" x="371.95" y="201.78" font-size="10.5" fill="#b4c0cb" text-anchor="middle" textLength="44.1" lengthAdjust="spacing">oxmysql</text></svg>
