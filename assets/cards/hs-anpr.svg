xtLength="27.6" lengthAdjust="spacing">v1.1</text><text class="s" x="24" y="102" font-size="13.5" fill="#a3b0bc">Front &amp; rear plate readers in patrol cars plus fixed</text><text class="s" x="24" y="122" font-size="13.5" fill="#a3b0bc">intersection cameras. Segment-crossing detection, so</text><text class="s" x="24" y="142" font-size="13.5" fill="#a3b0bc">a fast car can&#x27;t slip past a camera between ticks.</text><rect x="25" y="164.5" width="6" height="6" transform="rotate(45 28 167.5)" fill="#8BE6E6"/><text class="m" x="40" y="172" font-size="11" fill="#8BE6E6">0 SQL queries per plate read · flags from hs-mdt</text><rect x="24.0" y="188" width="34.9" height="20" rx="6" fill="#10161c" stroke="#1f2833"/><text class="m" x="41.45" y="201.78" font-size="10.5" fill="#b4c0cb" text-anchor="middle" textLength="18.9" lengthAdjust="spacing">Lua</text><rect x="64.9" y="188" width="60.1" height="20" rx="6" fill="#10161c" stroke="#1f2833"/><text class="m" x="94.95" y="201.78" font-size="10.5" fill="#b4c0cb" text-anchor="middle" textLength="44.1" lengthAdjust="spacing">OneSync</text><rect x="131.0" y="188" width="34.9" height="20" rx="6" fill="#10161c" stroke="#1f2833"/><text class="m" x="148.45" y="201.78" font-size="10.5" fill="#b4c0cb" text-anchor="middle" textLength="18.9" lengthAdjust="spacing">NUI</text><rect x="171.9" y="188" width="34.9" height="20" rx="6" fill="#10161c" stroke="#1f2833"/><text class="m" x="189.35" y="201.78" font-size="10.5" fill="#b4c0cb" text-anchor="middle" textLength="18.9" lengthAdjust="spacing">KVP</text><rect x="212.8" y="188" width="60.1" height="20" rx="6" fill="#10161c" stroke="#1f2833"/><text class="m" x="242.85" y="201.78" font-size="10.5" fill="#b4c0cb" text-anchor="middle" textLength="44.1" lengthAdjust="spacing">oxmysql</text></svg>
