# Draws the contribution snake shown in the TELEMETRY section of the profile README.
# It runs twice a day, on every push to main, and on demand (Actions → snake → Run workflow),
# and publishes snake.svg / snake-dark.svg to the `output` branch.
name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake.svg and snake-dark.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#d97706&color_dots=#ebedf0,#a5e9e9,#64cacb,#2a9899,#1f7475
            dist/snake-dark.svg?color_snake=#fbbf24&color_dots=#161b22,#0e4b4c,#1f7475,#3fbabb,#8be6e6

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
